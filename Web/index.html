<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kline Web 试点</title>
    <style>
      /* 启动骨架屏：WebView 加载完成 → Vue 挂载之间的白屏兜底（mount 替换 #app 内容后自动消失） */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        color: #1989fa;
        font-family: -apple-system, system-ui, sans-serif;
      }
      #boot .boot-mark {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      #boot .boot-spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(25, 137, 250, 0.25);
        border-top-color: #1989fa;
        border-radius: 50%;
        animation: bootspin 0.8s linear infinite;
      }
      @keyframes bootspin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #boot { background: #101317; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" aria-hidden="true">
        <div class="boot-mark">K</div>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
