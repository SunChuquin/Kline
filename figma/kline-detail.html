<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2b2b2b;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}

.frame{width:1024px;height:768px;background:#fff;overflow:hidden;display:flex;flex-direction:column;flex:none}

.back{width:30px;height:28px;background:#EDEDED;border-radius:6px;display:flex;align-items:center;justify-content:center}

.code{font-size:11px;color:#8E8E8E;white-space:nowrap}

.tbtn{width:32px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#8E8E8E}
.tbtn.small{width:28px}
.divider{height:0.5px;background:rgba(127,127,127,0.3);flex:none}
.chart-area{flex:1;display:flex;flex-direction:column;min-height:0}
.legend{height:18px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px;overflow:hidden}
.ind-btn{font-size:10px;font-weight:500;color:#000;background:#EDEDED;border-radius:4px;padding:2px 6px;white-space:nowrap;flex:none}
.li{font-size:12px;white-space:nowrap}
.li.sm{font-size:11px}
.zoom{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
svg.chart{display:block;flex:none}
.quote{height:18px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px}
.qk{font-size:9px;color:#8E8E8E}
.qv{font-size:10px}
.taxis{height:18px;flex:none;display:flex;align-items:center;padding:0 4px;font-size:10px;color:#8E8E8E}
</style>
