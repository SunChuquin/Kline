name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Certificate and Profile
        env:
          CERT_B64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          echo "$CERT_B64" | base64 -d > cert.p12
          echo "$PROFILE_B64" | base64 -d > profile.mobileprovision

          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASS" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Validate Provisioning Profile
        run: |
          set -e
          security cms -D -i profile.mobileprovision -o profile.plist
          python3 - <<'PY'
          import plistlib
          with open('profile.plist', 'rb') as f:
              p = plistlib.load(f)
          entitlements = p.get('Entitlements', {}) or {}
          appid  = entitlements.get('application-identifier', '')
          team   = p.get('TeamIdentifier', [])
          exp    = p.get('ExpirationDate', '')
          devs   = p.get('ProvisionedDevices', [])
          print('=== Provisioning Profile Info ===')
          print('Name                    :', p.get('Name'))
          print('AppIDName               :', p.get('AppIDName'))
          print('application-identifier  :', appid)
          print('TeamIdentifier          :', team)
          print('ExpirationDate          :', exp)
          print('ProvisionedDevices count:', len(devs))
          print('================================')
          ok = True
          if 'com.sunck.Kline' not in ''.join(appid):
              print('!! MISMATCH: application-identifier does not contain com.sunck.Kline')
              ok = False
          if '4G3V8W86TN' not in team:
              print('!! MISMATCH: TeamIdentifier does not contain 4G3V8W86TN')
              ok = False
          if not ok:
              print('Profile does NOT match target. Fix profile and update PROVISION_PROFILE_BASE64 secret.')
              exit(1)
          print('Profile matches com.sunck.Kline / 4G3V8W86TN.')
          PY

      - name: Build Archive
        run: |
          set -e
          xcodebuild \
            -project Kline.xcodeproj \
            -scheme Kline \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Kline.xcarchive \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        run: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/Kline.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kline
          path: build/*.ipa