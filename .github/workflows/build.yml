name: CI Build App (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .app + .ipa
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build .app (unsigned)
        run: |
          xcodebuild -project Kline.xcodeproj \
            -scheme Kline \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app to .ipa
        run: |
          mkdir -p Payload
          cp -R ./build/Build/Products/Release-iphoneos/Kline.app Payload/
          zip -r Kline.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kline-unsigned-ipa
          path: Kline.ipa

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kline-unsigned-app
          path: ./build/Build/Products/Release-iphoneos/Kline.app
