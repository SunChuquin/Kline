name: CI Build App (unsigned + ad-hoc for TrollStore)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build .app + .ipa (ad-hoc signed)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build .app (unsigned)
        run: |
          xcodebuild -project Kline.xcodeproj \
            -scheme Kline \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build & embed root helpers
        run: |
          APP_PATH="./build/Build/Products/Release-iphoneos/Kline.app"
          SDKS=$(xcrun -sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDKS"
          # rootprobe：打印/退出码验证是否拿到 root
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$SDKS" -o rootprobe "$GITHUB_WORKSPACE/rootprobe.c"
          cp rootprobe "$APP_PATH/rootprobe"
          # opener：装完自动打开新版（需 CoreFoundation），以 root 运行
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$SDKS" -framework CoreFoundation \
            -o opener "$GITHUB_WORKSPACE/opener.c"
          cp opener "$APP_PATH/opener"
          file "$APP_PATH/rootprobe" "$APP_PATH/opener"

      - name: Ad-hoc sign .app for TrollStore (with no-sandbox entitlements)
        run: |
          APP_PATH="./build/Build/Products/Release-iphoneos/Kline.app"
          BIN_PATH="$APP_PATH/Kline"
          ENT="${GITHUB_WORKSPACE}/Kline.entitlements"
          echo "=== Entitlements source file ==="
          cat "$ENT"
          echo ""
          echo "=== Dump entitlements BEFORE signing (should be empty / missing) ==="
          codesign -d --entitlements :- "$BIN_PATH" 2>&1 || echo "(no signature yet -> expected)"
          echo ""
          echo "=== Ad-hoc signing + inject entitlements into all Mach-O ==="
          # 先给主二进制注入 entitlements（含 no-sandbox）
          codesign -f -s - --entitlements "$ENT" "$BIN_PATH"
          # 再给 .app 下其他 Mach-O（dylib/PlugIns 等）做无 entitlements 的 ad-hoc 签名，
          # 避免整个 --deep 签给非主程序二进制套上 no-sandbox（可能导致闪退）
          find "$APP_PATH" -type f ! -name "Kline" -exec sh -c 'file "$1" | grep -qE "^.*: Mach-O" && echo "  signing: $1" && codesign -f -s - "$1"' _ {} \; 2>&1 | head -50
          echo ""
          echo "=== Verify signature on .app bundle ==="
          codesign -v "$APP_PATH" 2>&1 || true
          echo ""
          echo "=== Dump entitlements AFTER signing on main binary ==="
          codesign -d --entitlements :- "$BIN_PATH" 2>&1
          echo ""
          echo "Done."

      - name: Set TrollStore display name (Kline-TS)
        run: |
          APP_PATH="./build/Build/Products/Release-iphoneos/Kline.app"
          # 与 Xcode 编译版（显示名 Kline）区分，TrollStore 版显示 Kline-TS
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Kline-TS" "$APP_PATH/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Kline-TS" "$APP_PATH/Info.plist"
          echo "DisplayName:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist"

      - name: Inject unique build number (for deploy detection)
        run: |
          APP_PATH="./build/Build/Products/Release-iphoneos/Kline.app"
          # 每次构建注入唯一构建号（GitHub run number）：部署助手据此区分"旧版仍开着"与"新版已打开"
          # 注意：PlistBuddy 的 Set 不支持类型参数（会写入字面 "string xxx"），必须 Delete + Add 指定 string 类型
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $GITHUB_RUN_NUMBER" "$APP_PATH/Info.plist"
          echo "CFBundleVersion:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"

      - name: Package .app to .ipa
        run: |
          mkdir -p Payload
          cp -R ./build/Build/Products/Release-iphoneos/Kline.app Payload/
          zip -r Kline.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kline-unsigned-ipa
          path: Kline.ipa

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kline-unsigned-app
          path: ./build/Build/Products/Release-iphoneos/Kline.app
